name: ForgeBuzz · Publish due posts

# Runs every 20 minutes and publishes whichever queued posts are now due. The
# fine granularity lets "variable" (randomized) posting times actually land close
# to when they were scheduled. Unlimited Actions minutes (public repo) make the
# extra runs free.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/publish
        run: |
          curl --fail-with-body --show-error --silent \
            --retry 3 --retry-delay 10 --max-time 120 \
            -X POST "${{ secrets.FORGEBUZZ_URL }}/api/publish" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
