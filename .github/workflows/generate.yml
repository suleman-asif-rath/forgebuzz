name: ForgeBuzz · Generate daily memes

# Fills the day's queue each morning (09:00 Pakistan = 04:00 UTC).
# Vercel's free cron only runs ~daily, so GitHub Actions is the timer.
#
# /api/generate is INCREMENTAL: each call builds at most a few memes, because a
# full day (two Gemini calls, a photo lookup, a render and an upload per post)
# does not fit in one 60s serverless run. So we call it until the day is full.
# Re-running after that is a no-op, which also makes a manual run safe.
#
# Two schedules, not one. The Gemini free tier resets its daily quota on
# Google's cycle (midnight Pacific, roughly 07:00-08:00 UTC), which is AFTER
# the 04:00 run — so if yesterday's quota was spent, the morning run writes
# nothing and the day stays empty. The 08:00 top-up lands just after the reset
# and fills whatever is missing. Because generation is idempotent (it stops at
# "day already full"), a day that filled at 04:00 makes the second run a no-op.
on:
  schedule:
    - cron: "0 4 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Fill the day's queue
        env:
          URL: ${{ secrets.FORGEBUZZ_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          for i in 1 2 3 4 5; do
            resp=$(curl --fail-with-body --show-error --silent \
              --retry 2 --retry-delay 10 --max-time 120 \
              -X POST "$URL/api/generate" -H "x-cron-secret: $SECRET")
            echo "pass $i: $resp"

            if echo "$resp" | grep -q 'day already full'; then
              echo "Day is full. Done."
              exit 0
            fi
            if echo "$resp" | grep -q '"picked":0'; then
              echo "Nothing built this pass; stopping so we don't spin."
              exit 0
            fi
            sleep 5
          done
          echo "Reached the pass limit; the publish job will post whatever is queued."
