name: ForgeBuzz · Daily reel

# Fires at five candidate slots (05/08/11/14/16 UTC = 10:00/13:00/16:00/19:00/
# 21:00 PKT). Each run builds ONE reel until the dashboard's "reels per day" cap
# is hit. In "fixed" mode the earliest slots are used; in "variable" mode a
# random subset is used so reel times differ each day (see runReel). These UTC
# hours MUST match REEL_SLOT_UTC in lib/pipeline.ts. Building and publishing are
# separate calls so neither exceeds the serverless time budget.
on:
  schedule:
    - cron: "0 5,8,11,14,16 * * *"
  workflow_dispatch: {}

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - name: Build reel, then publish if one was queued
        env:
          URL: ${{ secrets.FORGEBUZZ_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          resp=$(curl --show-error --silent --max-time 90 \
            -X POST "$URL/api/reel" -H "x-cron-secret: $SECRET")
          echo "reel build: $resp"
          if echo "$resp" | grep -q '"mode":"queued"'; then
            echo "publishing the queued reel..."
            curl --fail-with-body --show-error --silent --retry 2 --retry-delay 10 --max-time 150 \
              -X POST "$URL/api/publish" -H "x-cron-secret: $SECRET"
          fi
