name: ForgeBuzz · Daily reel

# Runs at a fixed evening slot (13:00 & 14:00 UTC = 18:00 & 19:00 PKT). The
# one-reel-per-day guard means only the first of the two attempts actually posts;
# the second is a cheap retry in case the first is skipped by GitHub. Running on
# a fixed schedule (instead of hourly) keeps Actions-minute usage low. Building
# and publishing are two separate calls so neither exceeds the serverless time
# budget; publish only runs when a reel was queued.
on:
  schedule:
    - cron: "0 13,14 * * *"
  workflow_dispatch: {}

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - name: Build reel, then publish if one was queued
        env:
          URL: ${{ secrets.FORGEBUZZ_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          resp=$(curl --show-error --silent --max-time 90 \
            -X POST "$URL/api/reel" -H "x-cron-secret: $SECRET")
          echo "reel build: $resp"
          if echo "$resp" | grep -q '"mode":"queued"'; then
            echo "publishing the queued reel..."
            curl --fail-with-body --show-error --silent --retry 2 --retry-delay 10 --max-time 150 \
              -X POST "$URL/api/publish" -H "x-cron-secret: $SECRET"
          fi
