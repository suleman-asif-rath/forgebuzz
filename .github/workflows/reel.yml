name: ForgeBuzz · Daily reel

# Runs at three daily slots (05:00/10:00/15:00 UTC = 10:00/15:00/20:00 PKT),
# spread across the day to hit different audience windows. Each run builds ONE
# reel until the dashboard's "reels per day" cap is hit (default 3), so with the
# cap at 1 or 2 the later slots simply skip. Building and publishing are two
# separate calls so neither exceeds the serverless time budget; publish only runs
# when a reel was queued.
on:
  schedule:
    - cron: "0 5,10,15 * * *"
  workflow_dispatch: {}

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - name: Build reel, then publish if one was queued
        env:
          URL: ${{ secrets.FORGEBUZZ_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          resp=$(curl --show-error --silent --max-time 90 \
            -X POST "$URL/api/reel" -H "x-cron-secret: $SECRET")
          echo "reel build: $resp"
          if echo "$resp" | grep -q '"mode":"queued"'; then
            echo "publishing the queued reel..."
            curl --fail-with-body --show-error --silent --retry 2 --retry-delay 10 --max-time 150 \
              -X POST "$URL/api/publish" -H "x-cron-secret: $SECRET"
          fi
