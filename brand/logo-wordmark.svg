<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 130" role="img" aria-label="Cantagio logo">
  <title>Cantagio horizontal logo lockup</title>
  <defs>
    <linearGradient id="soft" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3E86FF"/>
      <stop offset="1" stop-color="#63C6F5"/>
    </linearGradient>
  </defs>
  <!-- C tile mark -->
  <g transform="translate(6 5)">
    <rect x="8" y="8" width="104" height="104" rx="27" fill="url(#soft)"/>
    <path d="M84.4 30.9 A38 38 0 1 0 84.4 89.1" fill="none" stroke="#0B1020"
          stroke-width="15" stroke-linecap="round"/>
  </g>
  <!-- wordmark (renders with Anton where available; falls back to Impact) -->
  <text x="146" y="92" font-family="Anton, 'Arial Narrow', Impact, sans-serif"
        font-size="90" letter-spacing="1" fill="#EDF1FA">CANTAGIO</text>
</svg>
