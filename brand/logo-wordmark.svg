<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 130" role="img" aria-label="ForgeBuzz logo">
  <title>ForgeBuzz horizontal logo lockup</title>
  <defs>
    <linearGradient id="sg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3E86FF"/>
      <stop offset="1" stop-color="#63C6F5"/>
    </linearGradient>
  </defs>
  <!-- spark tile mark -->
  <g transform="translate(6 5)">
    <rect x="8" y="8" width="104" height="104" rx="27" fill="url(#sg)"/>
    <path d="M60 22 C 62 48 72 58 98 60 C 72 62 62 72 60 98 C 58 72 48 62 22 60 C 48 58 58 48 60 22 Z" fill="#0B1020"/>
  </g>
  <!-- wordmark (renders with Anton where available; falls back to Impact) -->
  <text x="146" y="92" font-family="Anton, 'Arial Narrow', Impact, sans-serif"
        font-size="84" letter-spacing="0.5" fill="#EDF1FA">Forge<tspan fill="#63C6F5">Buzz</tspan></text>
</svg>
